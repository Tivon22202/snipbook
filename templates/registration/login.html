{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="narrow"><h1>Log in</h1>
<form method="post" class="stack">{% csrf_token %}{{ form.as_p }}
<input type="hidden" name="next" value="{{ next }}">
<button class="btn" type="submit">Log in</button></form>
<p class="muted">New here? <a href="{% url 'register' %}">Create an account</a>.</p></div>
{% endblock %}
