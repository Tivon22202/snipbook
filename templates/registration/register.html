{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="narrow"><h1>Create your account</h1>
<form method="post" class="stack">{% csrf_token %}{{ form.as_p }}
<button class="btn" type="submit">Create account</button></form>
<p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a>.</p></div>
{% endblock %}
